[tools]
"github:please-behave/cli" = "0.15.2"
node = "24.22.3"
python = "3.15.2"
actionlint = "1.7.12"
yq = "4.54.3"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
gh = "2.103.3"
ruff = "0.17.4"
"aqua:boyter/scc" = "4.1.0"

[tasks.format]
description = "Format Python sources"
run = "ruff format"

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Fetch locked npm dependencies for CI and Git hooks"
run = "npm ci --ignore-scripts"

[tasks.package]
description = "Export the verified Docker image candidate without rebuilding"
run = "python3 .github/scripts/release-artifacts.py package"

[tasks.release]
description = "Start the Release workflow for remote main"
run = "gh workflow run release.yml --ref main"

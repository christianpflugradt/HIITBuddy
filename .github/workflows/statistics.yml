name: Statistics
on:
  push:
    branches: [main]
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  collect:
    name: Collect statistics
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node python aqua:boyter/scc
          experimental: true
          version: 2026.11.11
      - name: Fetch locked dependencies
        run: mise run setup
      - name: Run tests with coverage
        run: |
          mkdir -p tmp/statistics
          npm run build
          node --test --experimental-test-coverage --test-coverage-include='dist/**/*.js' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=tmp/lcov.info | tee tmp/test-output.txt
      - name: Write coverage metrics
        run: python3 .github/scripts/write-coverage-metrics.py tmp/lcov.info tmp/statistics
      - name: Write lines of code and test count metrics
        run: |
          scc --format json --include-ext ts src >tmp/scc.json
          python3 .github/scripts/write-count-metrics.py tmp/scc.json tmp/test-output.txt tmp/statistics
      - name: Upload statistics metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statistics-metrics
          path: tmp/statistics
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish statistics
    needs:
      - collect
    if: github.ref == 'refs/heads/main'
    uses: christianpflugradt/please-behave-governance/.github/workflows/statistics-publish.yml@19e626fc8f927a8d909d6d7c11761096294b22c0 # updates/workflows/statistics
    with:
      project: hiitbuddy
    secrets:
      STATISTICS_TOKEN: ${{ secrets.STATISTICS_TOKEN }}

git_workflow:
  last_updated: "2026-06-10"
  ist_zustand:
    - Git workflow rules are documented for future agent turns.
    - Please Behave manages the Git hooks and validates commits and pushes; see .please/README.md.
    - pre-commit checks formatting and the AGENTS.md size.
    - commit-msg validates Conventional Commit headers; scopes are optional and none are defined.
    - pre-push runs npm run check, npm test and the other local rules.
  soll_zustand:
    - Git is initialized for the project.
    - Hooks are installed with please sync --yes.
    - Every file-changing user prompt is finished with a commit.
    - Commits use Conventional Commits without scopes.
    - Hooks must pass before commits and pushes are created.
  commit_convention:
    format: "type: subject"
    scopes: forbidden
    breaking_change_marker: allowed_before_colon
    allowed_types:
      - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
    examples:
      valid:
        - "feat: add workout timer"
        - "fix: keep cancel buttons valid"
        - "chore: initialize git workflow"
      invalid:
        - "feat(ui): add workout timer"
        - "fix(dialog): keep cancel buttons valid"
        - "update stuff"
  hooks:
    managed_by: Please Behave
    install: please sync --yes
